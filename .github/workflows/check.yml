name: selector check

on:
  schedule:
    - cron: '17 6 * * 1'        # montags 06:17 UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: check selectors
        id: check
        shell: bash
        run: |
          set -o pipefail          # sonst maskiert tee den Exit-Code von node
          node tools/check.mjs 2>&1 | tee report.txt
        continue-on-error: true

      - name: open issue on drift
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = '```\n' + fs.readFileSync('report.txt', 'utf8').slice(0, 60000) + '\n```';
            const title = `Selektor-Drift ${new Date().toISOString().slice(0, 10)}`;
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'selector-drift',
            });
            if (open.length) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: open[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo, title, body, labels: ['selector-drift'],
              });
            }
