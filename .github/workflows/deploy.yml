name: build

# Veröffentlicht wird per Pull auf dem Server, nicht aus dieser Action heraus:
# das Dokumentenwurzelverzeichnis von w3.msmr.co ist ein Klon dieses Repos, dort
# läuft nach jedem Pull `npm run publish` (siehe README). Node steht auf dem
# Server bereit, der Build hat keine Abhängigkeiten.
#
# Diese Action prüft deshalb nur, ob main baubar bleibt — kein SSH, keine
# Secrets. Fällt sie rot aus, würde der Pull auf dem Server ebenfalls scheitern.

on:
  push:
    branches: [main]
    paths: ['src/**', 'build.mjs', 'package.json', '.github/workflows/deploy.yml']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # build.mjs braucht die Commit-Historie für @version

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: build
        run: node build.mjs

      - name: verify
        run: |
          grep -m1 '@version' dist/reduce.user.css
          grep -c '^@-moz-document' dist/reduce.user.css
          test -s dist/reduce.user.css
