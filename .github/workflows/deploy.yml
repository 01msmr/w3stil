name: build & publish

# Veröffentlicht wird über das Repo selbst: diese Action baut und legt
# reduce.user.css als versionierte Datei in die Wurzel. Auf dem Server genügt
# danach ein git pull plus cp — dort ist kein Node erreichbar (Shared Hosting,
# eingeschränkte Shell), deshalb baut niemand mehr auf der Zielmaschine.
#
# Die Datei in dist/ bleibt das lokale Bauprodukt und weiterhin ignoriert.

on:
  push:
    branches: [main]
    paths: ['src/**', 'build.mjs', 'package.json', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: write

# Zwei gleichzeitige Läufe committen beide und der zweite wird abgewiesen.
# Nacheinander statt parallel — und nichts abbrechen, sonst bliebe eine
# Änderung unveröffentlicht.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # build.mjs braucht die Commit-Historie für @version

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: build
        run: node build.mjs

      - name: verify
        run: |
          grep -m1 '@version' dist/reduce.user.css
          test "$(grep -c '^@-moz-document' dist/reduce.user.css)" -ge 1
          test -s dist/reduce.user.css

      - name: publish into repo root
        run: cp dist/reduce.user.css reduce.user.css

      # Der Commit ändert nur reduce.user.css — die Datei steht nicht im
      # paths-Filter oben, löst also keinen weiteren Lauf aus.
      - name: commit if changed
        run: |
          if git diff --quiet -- reduce.user.css; then
            echo "unverändert, kein Commit"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reduce.user.css
          git commit -m "build: reduce.user.css $(grep -m1 '@version' reduce.user.css | tr -s ' ' | cut -d' ' -f2)"

          # Falls in der Zwischenzeit gepusht wurde: rebasen und erneut
          # versuchen, statt den Lauf scheitern zu lassen.
          git push || { git pull --rebase origin main && git push; }
